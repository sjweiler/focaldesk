[package]
name = "focaldesk-memory"
version = "0.1.0"
edition = "2021"
description = "Vector storage, embedding generation, semantic search, and long-term memory support for FocalDesk AI"
license = "MIT"
authors = ["Steve"]

[lib]
name = "focaldesk_memory"
path = "src/lib.rs"

[dependencies]
anyhow = "1"
async-trait = "0.1"
dirs = "6"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlite-vec = "0.1"
tokio = { version = "1", features = ["rt", "sync"] }
tracing = "0.1"
zerocopy = { version = "0.8", features = ["derive"] }

