[package]
name = "flow-automation"
version = "0.1.0"
edition = "2024"

[dependencies]
# crates/flowd/Cargo.toml
mlua = { version = "0.10", features = ["lua54", "vendored", "serialize"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }
anyhow = "1"
tracing = "0.1"
