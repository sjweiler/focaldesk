[package]
name = "focaldesk-automation"
version = "0.1.0"
edition = "2024"

[dependencies]
mlua = { version = "0.10", features = ["lua54", "vendored", "serialize"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "net", "io-util"] }
anyhow = "1"
chrono = { workspace = true }
dirs = "6"
tracing = "0.1"
focaldesk-logging = { path = "../focaldesk-logging" }
focaldesk-ipc = { path = "../focaldesk-ipc" }
