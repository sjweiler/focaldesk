[package]
name = "focaldesk-ipc"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "focaldesk-settingsd"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
focaldesk-settings-core = { path = "../focaldesk-settings-core" }
focaldesk-power = { path = "../focaldesk-power" }
focaldesk-notifications = { path = "../focaldesk-notifications" }
focaldesk-logging = { path = "../focaldesk-logging" }
focaldesk-config = { path = "../focaldesk-config" }
tracing = { workspace = true }
nix = { workspace = true, features = ["socket", "user"] }
libc = { workspace = true }

[dev-dependencies]
tempfile = "3"
