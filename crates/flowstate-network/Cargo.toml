[package]
name = "flowstate-network"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
async-trait = "0.1"
futures = "0.3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
rtnetlink = "0.20"
zbus = { version = "4", features = ["tokio"] }
libc = "0.2"
