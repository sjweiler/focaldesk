[package]
name = "focaldesk-ui"
version = "0.1.0"
edition = "2024"

[dependencies]
focaldesk-types = { path = "../focaldesk-types" }
focaldesk-themes = { path = "../focaldesk-themes" }
focaldesk-logging = { path = "../focaldesk-logging" }
focaldesk-config = { path = "../focaldesk-config" }
focaldesk-settings-core = { path = "../focaldesk-settings-core" }
focaldesk-ipc = { path = "../focaldesk-ipc" }
focaldesk-notifications = { path = "../focaldesk-notifications" }
focaldesk-updates = { path = "../focaldesk-updates" }
focaldesk-power = { path = "../focaldesk-power" }
focaldesk-network = { path = "../focaldesk-network" }
focaldesk-permissions = { path = "../focaldesk-permissions" }
focaldesk-ai = { path = "../focaldesk-ai" }
image.workspace = true
egui = { version = "0.31", features = ["accesskit"] }
egui_glow = "0.31"
accesskit_unix = { version = "0.13.1", default-features = false, features = ["tokio"] }
glow.workspace = true

tiny-skia.workspace = true
cosmic-text.workspace = true
swash.workspace = true
fontdb.workspace = true
usvg.workspace = true
resvg.workspace = true
chrono.workspace = true
ab_glyph.workspace = true
fontdue = "0.9"
anyhow.workspace = true
smithay = { workspace = true, features = ["renderer_gl"] }
