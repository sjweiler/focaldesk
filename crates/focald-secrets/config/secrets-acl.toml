# focald-secrets ACL — ~/.config/focaldesk/secrets-acl.toml
# Default posture is deny: a peer with no grant gets nothing.
# Edits take effect immediately (mtime-checked per request).
#
# Identities:
#   unit:<name>  systemd user unit of the peer (preferred; unforgeable)
#   exe:<path>   resolved /proc/<pid>/exe (fallback for non-unit processes)

[grants."unit:focaldesk-server.service"]
allow = ["ai/*"]
allow_write = []

[grants."unit:focaldesk-automation.service"]
allow = ["automation/*"]
# Write access narrower than read: can read automation/*, write only its own ns
allow_write = ["automation/state/*"]

# focald-voice deliberately gets no grant: no entry == no access.
