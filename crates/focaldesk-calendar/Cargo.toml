[package]
name = "focaldesk-calendar"
version = "0.1.0"
edition = "2024"
description = "Persistent, provider-neutral calendar storage and read-only sync for FocalDesk"
license = "MIT"

[dependencies]
anyhow = "1"
chrono = { workspace = true, features = ["serde"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"

[dev-dependencies]
tempfile = "3"
