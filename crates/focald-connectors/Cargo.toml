[package]
name = "focald-connectors"
version = "0.1.0"
edition = "2024"
description = "FocalDesk managed connector host"
license = "MIT"

[[bin]]
name = "focald-connectors"
path = "src/main.rs"

[dependencies]
anyhow = "1"
focaldesk-ai = { path = "../focaldesk-ai" }
focaldesk-calendar = { path = "../focaldesk-calendar" }
focaldesk-ipc = { path = "../focaldesk-ipc" }
focaldesk-secrets-client = { path = "../focaldesk-secrets-client" }
chrono = { workspace = true }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zeroize = { workspace = true }
base64 = "0.22"
rand = { workspace = true }
sha2 = { workspace = true }
url = "2"
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
