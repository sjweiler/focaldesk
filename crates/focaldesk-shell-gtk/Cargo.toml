[package]
name = "focaldesk-shell-gtk"
version = "0.1.0"
edition = "2021"
description = "Reusable GTK4 shell components for FocalDesk panel and dock clients"
license = "MIT"

[dependencies]
anyhow.workspace = true
focaldesk-ipc = { path = "../focaldesk-ipc" }
focaldesk-ai = { path = "../focaldesk-ai" }
focaldesk-logging = { path = "../focaldesk-logging" }
focaldesk-config = { path = "../focaldesk-config" }
focaldesk-settings-core = { path = "../focaldesk-settings-core" }
focaldesk-themes = { path = "../focaldesk-themes" }
vui-core = { git = "https://github.com/sjweiler/vello-ui", rev = "1e46b0cd1d44cddac1b6cb9b0478f57e6afa9b1a" }
vui-vello = { git = "https://github.com/sjweiler/vello-ui", rev = "1e46b0cd1d44cddac1b6cb9b0478f57e6afa9b1a" }
vui-text = { git = "https://github.com/sjweiler/vello-ui", rev = "1e46b0cd1d44cddac1b6cb9b0478f57e6afa9b1a" }
chrono.workspace = true
gtk = { package = "gtk4", version = "0.9", features = ["v4_12"] }
gtk4-layer-shell = "0.4"
resvg.workspace = true
serde_json = "1"
zbus = "4"
