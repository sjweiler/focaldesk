[workspace]
members = [
  "crates/compositor",
  "crates/ui",
  "crates/ai",
  # add these if you want them in the workspace too:
  "crates/shell",
  "crates/ipc",
]
resolver = "2"

[workspace.dependencies]
smithay = { git = "https://github.com/Smithay/smithay", default-features = false, branch="master" }
calloop = "0.12"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
wayland-protocols = "0.32.10"
serde = { version = "1.0", features = ["derive"] }
