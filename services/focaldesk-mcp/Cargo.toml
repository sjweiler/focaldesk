[package]
name = "focaldesk-mcp"
version = "0.1.0"
edition = "2024"
description = "Policy-enforcing MCP adapter for FocalDesk typed IPC"
license = "MIT"

[[bin]]
name = "focaldesk-mcp"
path = "src/main.rs"

[dependencies]
focaldesk-ipc = { path = "../../crates/focaldesk-ipc" }
focaldesk-logging = { path = "../../crates/focaldesk-logging" }
serde = { workspace = true }
serde_json = "1"
tracing = { workspace = true }

[dev-dependencies]
tempfile = "3"
