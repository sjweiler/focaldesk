[package]
name = "focaldesk-browserd"
version = "0.1.0"
edition = "2024"

[features]
default = ["daemon"]
daemon = ["dep:chromiumoxide", "dep:futures", "dep:base64"]

[[bin]]
name = "focaldesk-browserd"
path = "src/main.rs"
required-features = ["daemon"]

[dependencies]
anyhow.workspace = true
serde.workspace = true
serde_json = "1"
focaldesk-ipc = { path = "../../crates/focaldesk-ipc" }
tokio = { version = "1", features = ["full"] }
url = "2"
chromiumoxide = { version = "0.9", optional = true }
futures = { version = "0.3", optional = true }
base64 = { version = "0.22", optional = true }
