[package]
name = "focaldesk-notificationsd"
version = "0.1.0"
edition = "2024"
description = "FocalDesk notification IPC daemon"
license = "MIT"

[[bin]]
name = "focaldesk-notificationsd"
path = "src/main.rs"

[dependencies]
anyhow = "1"
focaldesk-ipc = { path = "../../crates/focaldesk-ipc" }
focaldesk-logging = { path = "../../crates/focaldesk-logging" }
focaldesk-notifications = { path = "../../crates/focaldesk-notifications" }
focaldesk-settings-core = { path = "../../crates/focaldesk-settings-core" }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
zbus = { version = "5", default-features = false, features = ["tokio"] }
