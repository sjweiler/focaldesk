[package]
name = "focaldesk-ai-registry"
version = "0.1.0"
edition = "2024"
description = "Private signed package registry for FocalDesk AIOS"
license = "MIT"

[[bin]]
name = "focaldesk-ai-registry"
path = "src/main.rs"

[dependencies]
anyhow = { workspace = true }
focaldesk-ai = { path = "../../crates/focaldesk-ai" }
focaldesk-secrets-client = { path = "../../crates/focaldesk-secrets-client" }
rand = { workspace = true }
serde = { workspace = true }
serde_json = "1"
subtle = "2"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread", "signal"] }
zeroize = { workspace = true }
