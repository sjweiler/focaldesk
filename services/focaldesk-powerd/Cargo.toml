[package]
name = "focaldesk-powerd"
version = "0.1.0"
edition = "2024"
description = "FocalDesk power IPC daemon"
license = "MIT"

[[bin]]
name = "focaldesk-powerd"
path = "src/main.rs"

[dependencies]
anyhow = "1"
focaldesk-ipc = { path = "../../crates/focaldesk-ipc" }
focaldesk-logging = { path = "../../crates/focaldesk-logging" }
focaldesk-power = { path = "../../crates/focaldesk-power" }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
