name: CI

on:
  push:
  pull_request:

# Keep the full workspace (including WebKit/GTK) within hosted-runner disk limits.
env:
  CARGO_INCREMENTAL: '0'
  CARGO_PROFILE_DEV_DEBUG: '0'
  CARGO_PROFILE_TEST_DEBUG: '0'

permissions:
  contents: read
  pull-requests: read

jobs:
  rust:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect split-screen changes
        id: changes
        uses: dorny/paths-filter@v3
        with:
          filters: |
            split:
              - '.github/workflows/ci.yml'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'apps/focaldesk-cli/**'
              - 'apps/focaldesk-color-tag-test/**'
              - 'apps/focaldesk-desktop/**'
              - 'crates/focaldesk-engine/**'
              - 'crates/focaldesk-flow/**'
              - 'crates/focaldesk-ipc/**'
              - 'crates/focaldesk-render/**'
              - 'crates/focaldesk-settings-core/**'
              - 'crates/focaldesk-ui/**'
              - 'scripts/nested-split-e2e.sh'

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install Linux dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            meson \
            ninja-build \
            pkg-config \
            libwayland-dev \
            wayland-protocols \
            libxkbcommon-dev \
            libudev-dev \
            libinput-dev \
            libseat-dev \
            libpipewire-0.3-dev \
            libasound2-dev \
            libpolkit-gobject-1-dev \
            libpolkit-agent-1-dev \
            libclang-dev \
            libegl1-mesa-dev \
            libgles2-mesa-dev \
            libgbm-dev \
            libgtk-4-dev \
            libwebkit2gtk-4.1-dev \
            webkit2gtk-driver \
            libappindicator3-dev \
            librsvg2-dev \
            libadwaita-1-dev \
            libpam0g-dev \
            libsecret-tools \
            dbus-x11 \
            python3-dbus \
            wayland-utils \
            weston \
            xwayland \
            unzip

      - name: Install GTK4 layer shell
        env:
          GTK4_LAYER_SHELL_VERSION: "1.0.4"
        run: |
          source_dir="$RUNNER_TEMP/gtk4-layer-shell"
          git clone --branch "v${GTK4_LAYER_SHELL_VERSION}" --depth 1 \
            https://github.com/wmww/gtk4-layer-shell.git "$source_dir"
          meson setup "$source_dir/build" "$source_dir" \
            --prefix=/usr \
            -Dexamples=false \
            -Ddocs=false \
            -Dtests=false \
            -Dsmoke-tests=false \
            -Dintrospection=false \
            -Dvapi=false
          meson compile -C "$source_dir/build"
          sudo meson install -C "$source_dir/build"
          sudo ldconfig

      - name: Install Vosk native library
        env:
          VOSK_VERSION: "0.3.45"
          VOSK_SHA256: "bbdc8ed85c43979f6443142889770ea95cbfbc56cffb5c5dcd73afa875c5fbb2"
        run: |
          archive="$RUNNER_TEMP/vosk-linux-x86_64.zip"
          install_root="$RUNNER_TEMP/vosk"
          curl -fsSL \
            "https://github.com/alphacep/vosk-api/releases/download/v${VOSK_VERSION}/vosk-linux-x86_64-${VOSK_VERSION}.zip" \
            -o "$archive"
          echo "${VOSK_SHA256}  ${archive}" | sha256sum --check
          unzip -q "$archive" -d "$install_root"
          library_dir="$install_root/vosk-linux-x86_64-${VOSK_VERSION}"
          test -f "$library_dir/libvosk.so"
          echo "LIBRARY_PATH=$library_dir" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$library_dir" >> "$GITHUB_ENV"

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            apps/focaldesk-ai-console3/package-lock.json
            apps/focaldesk-automation-studio/frontend/package-lock.json
            apps/focalmail/frontend/package-lock.json
            apps/focaldesk-settings/frontend/package-lock.json
            packages/theme/package.json

      - name: Install desktop frontend dependencies
        run: |
          npm ci --prefix apps/focaldesk-automation-studio/frontend
          npm ci --prefix apps/focalmail/frontend

      - name: Build AI Console frontend
        working-directory: apps/focaldesk-ai-console3
        run: |
          npm ci
          npm run build

      - name: Build and test Settings preview
        working-directory: apps/focaldesk-settings/frontend
        run: |
          npm ci
          npm run build
          npm test

      - name: Check Settings Tauri integration
        run: |
          cargo clippy -p focaldesk-settings --no-default-features --features tauri-ui --all-targets -- -D warnings
          cargo test -p focaldesk-settings --no-default-features --features tauri-ui --lib
          cargo build -p focaldesk-settings --no-default-features --features tauri-ui --bin focaldesk-settings-next

      - name: Settings native WebKit integration
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          timeout 600 bash scripts/test-settings-ui.sh
          FOCALDESK_SETTINGS_TEST_SCOPE=exclusive timeout 120 bash scripts/test-settings-ui.sh
          FOCALDESK_SETTINGS_TEST_SCOPE=connection timeout 120 bash scripts/test-settings-ui.sh
          FOCALDESK_SETTINGS_TEST_SCOPE=wallpapers timeout 120 bash scripts/test-settings-ui.sh
          FOCALDESK_SETTINGS_TEST_SCOPE=power timeout 120 bash scripts/test-settings-ui.sh

      - name: Upload Settings UI evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: settings-native-ui
          path: |
            /tmp/focaldesk-settings-ui-*/
            /tmp/focaldesk-settings-session.*/
          if-no-files-found: ignore

      - name: Audio control and microphone lifecycle tests
        run: |
          cargo test -p focaldesk-audio
          cargo build -p focaldesk-audio --example audio_probe
          python3 apps/focaldesk-settings/tests/audio_runtime.py

      - name: Rustfmt
        run: cargo fmt --all -- --check

      - name: Cargo check
        run: cargo check --workspace

      - name: Crate boundaries
        run: |
          python3 scripts/check-crate-boundaries.py --self-test
          python3 scripts/check-crate-boundaries.py
          cargo check -p focaldesk-input --no-default-features

      - name: Clippy
        env:
          RUSTFLAGS: "-Dwarnings"
        run: cargo clippy --workspace --all-targets

      - name: Tests
        run: cargo test --workspace

      - name: Nested compositor compatibility smoke test
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: timeout 240 bash scripts/nested-smoke.sh

      - name: Display and theme preview crash recovery
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          FOCALDESK_DISPLAY_TEST_ARTIFACTS: target/display-trial
        run: timeout 180 bash scripts/test-display-trial.sh

      - name: Upload display trial artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: display-trial
          path: target/display-trial
          if-no-files-found: warn

      - name: Upload nested compatibility artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nested-smoke
          path: target/nested-smoke
          if-no-files-found: warn

      - name: Nested split-screen end-to-end test
        if: steps.changes.outputs.split == 'true'
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: timeout 300 bash scripts/nested-split-e2e.sh

      - name: Upload nested split-screen artifacts
        if: always() && steps.changes.outputs.split == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: nested-split-e2e
          path: target/nested-split-e2e
          if-no-files-found: warn
          retention-days: 7

      - name: focald-secrets end-to-end security tests
        run: bash crates/focald-secrets/tests/integration.sh

      - name: Check focald-secrets fuzz harness
        run: cargo check --locked --manifest-path crates/focald-secrets/fuzz/Cargo.toml

      - name: Install RustSec audit tool
        run: cargo install cargo-audit --locked

      - name: RustSec dependency audit
        run: |
          # egui 0.31 pins AccessKit's AT-SPI stack to zbus-xml 4 / quick-xml
          # 0.30. The parser cannot be upgraded independently; keep these two
          # DoS advisories visible here until the egui/AccessKit upgrade lands.
          # ironrdp-server 0.13 unconditionally includes its Hybrid/CredSSP
          # stack, which currently pulls rsa despite this service selecting
          # RdpServerSecurity::Tls via with_tls. FocalDesk never calls
          # with_hybrid, so the RSA private-key operation described by the
          # advisory is unreachable. RustSec lists no patched rsa release;
          # remove this exception when IronRDP makes CredSSP optional.
          cargo audit --file Cargo.lock \
            --ignore RUSTSEC-2026-0194 \
            --ignore RUSTSEC-2026-0195 \
            --ignore RUSTSEC-2023-0071
          cargo audit --file crates/focald-secrets/fuzz/Cargo.lock

      - name: Markdown links
        run: bash scripts/check-markdown-links.sh

      - name: Install and uninstall lifecycle
        run: bash scripts/test-install-lifecycle.sh
