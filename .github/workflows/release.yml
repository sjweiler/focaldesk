name: Alpha release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install Linux dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            meson ninja-build pkg-config libwayland-dev wayland-protocols \
            libxkbcommon-dev libudev-dev libinput-dev libseat-dev \
            libpipewire-0.3-dev libasound2-dev libpolkit-gobject-1-dev \
            libpolkit-agent-1-dev libclang-dev libegl1-mesa-dev \
            libgles2-mesa-dev libgbm-dev libgtk-4-dev libadwaita-1-dev \
            libpam0g-dev libsecret-tools dbus-x11 python3-dbus wayland-utils \
            weston xwayland unzip

      - name: Install GTK4 layer shell
        env:
          GTK4_LAYER_SHELL_VERSION: "1.0.4"
        run: |
          source_dir="$RUNNER_TEMP/gtk4-layer-shell"
          git clone --branch "v${GTK4_LAYER_SHELL_VERSION}" --depth 1 \
            https://github.com/wmww/gtk4-layer-shell.git "$source_dir"
          meson setup "$source_dir/build" "$source_dir" --prefix=/usr \
            -Dexamples=false -Ddocs=false -Dtests=false -Dsmoke-tests=false \
            -Dintrospection=false -Dvapi=false
          meson compile -C "$source_dir/build"
          sudo meson install -C "$source_dir/build"
          sudo ldconfig

      - name: Install Vosk native library
        env:
          VOSK_VERSION: "0.3.45"
          VOSK_SHA256: "bbdc8ed85c43979f6443142889770ea95cbfbc56cffb5c5dcd73afa875c5fbb2"
        run: |
          archive="$RUNNER_TEMP/vosk.zip"
          install_root="$RUNNER_TEMP/vosk"
          curl -fsSL "https://github.com/alphacep/vosk-api/releases/download/v${VOSK_VERSION}/vosk-linux-x86_64-${VOSK_VERSION}.zip" -o "$archive"
          echo "${VOSK_SHA256}  ${archive}" | sha256sum --check
          unzip -q "$archive" -d "$install_root"
          library_dir="$install_root/vosk-linux-x86_64-${VOSK_VERSION}"
          echo "LIBRARY_PATH=$library_dir" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$library_dir" >> "$GITHUB_ENV"

      - name: Release readiness
        run: bash scripts/check-release-readiness.sh

      - name: Verify source and build
        env:
          RUSTFLAGS: "-Dwarnings"
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets
          cargo test --workspace
          timeout 240 bash scripts/nested-smoke.sh
          cargo build --release --workspace

      - name: Package binaries and support files
        run: |
          staging="$RUNNER_TEMP/focaldesk-${GITHUB_REF_NAME}"
          mkdir -p "$staging/bin"
          for binary in \
            focaldesk-desktop focaldesk-cli focaldesk-files focaldesk-settings \
            focaldesk-launcher focaldesk-ai-console focaldesk-server \
            focaldesk-remoted focaldesk-portal focaldesk-mcp focaldesk-powerd \
            focaldesk-notificationsd focaldesk-updatesd focaldesk-dialogd \
            focaldesk-controlsd focaldesk-settingsd focaldesk-automation \
            focaldesk-polkitd focal-launchd focaldmd \
            focaldm-greeter focald-secrets focald-secrets-keytool \
            focald-secrets-import-gnome-keyring focald-voice focald-speech \
            focald-mic focaldesk-system-rail focaldesk-task-shelf; do
            test -x "target/release/$binary"
            install -m755 "target/release/$binary" "$staging/bin/$binary"
          done
          cp -a assets packaging scripts README.md ROADMAP.md CHANGELOG.md \
            LICENSE SECURITY.md docs "$staging/"
          tar -C "$RUNNER_TEMP" -czf "focaldesk-${GITHUB_REF_NAME}-linux-x86_64.tar.gz" \
            "focaldesk-${GITHUB_REF_NAME}"
          sha256sum "focaldesk-${GITHUB_REF_NAME}-linux-x86_64.tar.gz" \
            > "focaldesk-${GITHUB_REF_NAME}-linux-x86_64.tar.gz.sha256"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "focaldesk-${GITHUB_REF_NAME}-linux-x86_64.tar.gz" \
            "focaldesk-${GITHUB_REF_NAME}-linux-x86_64.tar.gz.sha256" \
            --title "FocalDesk $GITHUB_REF_NAME" \
            --generate-notes \
            --prerelease
