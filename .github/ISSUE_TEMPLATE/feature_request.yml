name: Feature request
description: Propose a focused improvement consistent with the project direction
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user or developer problem should be solved?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe the visible behavior and its boundaries.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Note workarounds or smaller approaches considered.
  - type: textarea
    id: architecture
    attributes:
      label: Architectural and security considerations
      description: Identify affected compositor, IPC, service, permission, file, or protocol boundaries.
  - type: checkboxes
    id: scope
    attributes:
      label: Scope check
      options:
        - label: I reviewed the README status table and ROADMAP.md.
          required: true
