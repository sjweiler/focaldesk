name: Bug report
description: Report reproducible incorrect behavior in FocalDesk
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve FocalDesk. Remove credentials and private data from logs and screenshots. Report security vulnerabilities privately through SECURITY.md.
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect FocalDesk to do?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What happened instead?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
      description: Provide the smallest reliable sequence that triggers the problem.
      placeholder: |
        1. Start FocalDesk using ...
        2. Open ...
        3. Perform ...
    validations:
      required: true
  - type: dropdown
    id: backend
    attributes:
      label: Backend
      options:
        - DRM/KMS session
        - Nested winit session
        - Unknown
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include commit, distribution, kernel, GPU, driver, outputs, and relevant application versions.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Paste a short redacted excerpt or attach a redacted log file.
      render: text
  - type: checkboxes
    id: checks
    attributes:
      label: Pre-submission checks
      options:
        - label: I tested a current repository revision or identified the exact commit used.
          required: true
        - label: I removed credentials and private information.
          required: true
        - label: This is not a security vulnerability.
          required: true
