[package]
name = "focaldesk-portal"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
focaldesk-ipc = { path = "../../crates/focaldesk-ipc" }
focaldesk-settings-core = { path = "../../crates/focaldesk-settings-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
wayland-client = "0.31"
zbus = { version = "5", default-features = false, features = ["tokio"] }
