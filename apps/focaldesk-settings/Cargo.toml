[package]
name = "focaldesk-settings"
version = "0.1.0"
edition = "2021"

[dependencies]
gtk = { package = "gtk4", version = "0.9", features = ["v4_12"] }
adw = { package = "libadwaita", version = "0.7", features = ["v1_4"] }

serde = { version = "1", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
anyhow = "1"
dirs = "5"
focaldesk-logging = { path = "../../crates/focaldesk-logging" }
focaldesk-config = { path = "../../crates/focaldesk-config" }
focaldesk-ipc = { path = "../../crates/focaldesk-ipc" }
focaldesk-settings-core = { path = "../../crates/focaldesk-settings-core" }
focaldesk-power = { path = "../../crates/focaldesk-power" }
focaldesk-bluetooth = { path = "../../crates/focaldesk-bluetooth" }
focaldesk-sounds = { path = "../../crates/focaldesk-sounds" }
tracing = { workspace = true }
