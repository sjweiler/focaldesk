[package]
name = "focaldesk-automation-studio"
version = "0.1.0"
edition = "2024"

[features]
default = ["desktop", "custom-protocol"]
desktop = ["dep:tauri", "dep:tauri-build"]
custom-protocol = ["tauri?/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", optional = true }

[dependencies]
focaldesk-automation = { path = "../../crates/focaldesk-automation" }
serde_json = "1"
tauri = { version = "2", optional = true }
