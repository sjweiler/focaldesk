[package]
name = "focaldesk-desktop"
version = "0.1.0"
edition = "2021"
description = "FocalDesk desktop compositor executable"
license = "MIT"

[[bin]]
name = "focaldesk-desktop"
path = "src/main.rs"

[dependencies]
# Primary API namespace (recommended)
focaldesk-engine = { path = "../../crates/focaldesk-engine", default-features = false  }
focaldesk-logging = { path = "../../crates/focaldesk-logging" }
focaldesk-ui = { path = "../../crates/focaldesk-ui" }

# Logging and error handling
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[features]
default = ["drm", "xwayland"]
winit = ["focaldesk-engine/winit"]
drm = ["focaldesk-engine/drm"]
xwayland = ["focaldesk-engine/xwayland"]
