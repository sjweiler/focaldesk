[package]
name = "focaldesk-ai-console3"
version = "0.1.0"
edition = "2021"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[lib]
name = "focaldesk_ai_console_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
focaldesk-logging = { path = "../../../crates/focaldesk-logging" }
anyhow = "1"
rfd = { version = "0.15", default-features = false, features = ["xdg-portal", "tokio"] }
serde = { version = "1", features = ["derive"] }
base64 = "0.22"
pdf-extract = "0.12.1"
url = "2"
focaldesk-ipc = { path = "../../../crates/focaldesk-ipc" }
focaldesk-secrets-client = { path = "../../../crates/focaldesk-secrets-client" }

focaldesk-browserd = { path = "../../../services/focaldesk-browserd", default-features = false }
tauri = { version = "2", features = [] }
serde_json = "1"

focaldesk-ai = { path = "../../../crates/focaldesk-ai" }

[[bin]]
name = "focaldesk-ai-console"
path = "src/main.rs"
