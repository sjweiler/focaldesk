[package]
name = "flowstate-desktop"
version = "0.1.0"
edition = "2021"
description = "FlowState desktop compositor executable"
license = "MIT"

[[bin]]
name = "flowstate-desktop"
path = "src/main.rs"

[dependencies]
# Primary API namespace (recommended)
flowstate-engine = { path = "../../crates/flowstate-engine", default-features = false  }
flowstate-logging = { path = "../../crates/flowstate-logging" }
flowstate-ui = { path = "../../crates/flowstate-ui" }

# Logging and error handling
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[features]
default = ["winit"]
winit = ["flowstate-engine/winit"]
drm = ["flowstate-engine/drm"]
xwayland = ["flowstate-engine/xwayland"]
