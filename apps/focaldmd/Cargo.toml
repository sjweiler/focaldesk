[package]
name = "focaldmd"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "=1.38.2", features = ["rt", "macros", "net", "process", "sync", "time", "signal", "io-util"] }
nix = { version = "0.29", features = ["user", "signal", "socket", "fs"] }
pam-client = { version = "0.5", default-features = false }
zeroize = "=1.7.0"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
tracing = "0.1"
tracing-subscriber = "0.3"
