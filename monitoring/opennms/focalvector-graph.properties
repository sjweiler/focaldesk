reports=focalvector.count,focalvector.queries,focalvector.latency

report.focalvector.count.name=FocalVector Collection Size
report.focalvector.count.columns=fvVectorCount
report.focalvector.count.type=focalVectorCollection
report.focalvector.count.command=--title="FocalVector Collection Size" \
 --vertical-label="Vectors" --lower-limit=0 \
 DEF:count={rrd1}:fvVectorCount:AVERAGE \
 LINE2:count#2563EB:"Vectors"

report.focalvector.queries.name=FocalVector Query Rate
report.focalvector.queries.columns=fvQueries,fvFailures
report.focalvector.queries.type=focalVectorCollection
report.focalvector.queries.command=--title="FocalVector Query Rate" \
 --vertical-label="Queries per second" --lower-limit=0 \
 DEF:queries={rrd1}:fvQueries:AVERAGE \
 DEF:failures={rrd2}:fvFailures:AVERAGE \
 LINE2:queries#2563EB:"Completed" \
 LINE2:failures#DC2626:"Failed"

report.focalvector.latency.name=FocalVector Average Query Latency
report.focalvector.latency.columns=fvQueryUs,fvSamples
report.focalvector.latency.type=focalVectorCollection
report.focalvector.latency.command=--title="FocalVector Average Query Latency" \
 --vertical-label="Milliseconds" --lower-limit=0 \
 DEF:elapsed={rrd1}:fvQueryUs:AVERAGE \
 DEF:samples={rrd2}:fvSamples:AVERAGE \
 CDEF:latency=samples,0,GT,elapsed,samples,/,1000,/,UNKN,IF \
 LINE2:latency#2563EB:"Mean latency"
