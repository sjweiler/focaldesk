<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
<defs>
  <linearGradient id="tealGrad" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#A6C4C8"/><stop offset="55%" stop-color="#6E9198"/><stop offset="100%" stop-color="#355961"/>
  </linearGradient>
  <linearGradient id="creamGrad" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#FFF8EA"/><stop offset="100%" stop-color="#D6C8A8"/>
  </linearGradient>
  <linearGradient id="orangeGrad" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#F0A54A"/><stop offset="100%" stop-color="#C76A2A"/>
  </linearGradient>
  <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="1.7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <style>
