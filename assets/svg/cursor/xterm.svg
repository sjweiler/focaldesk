<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
<defs>
  <linearGradient id="tealGrad" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#A6C4C8"/><stop offset="55%" stop-color="#6E9198"/><stop offset="100%" stop-color="#355961"/>
  </linearGradient>
  <linearGradient id="creamGrad" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#FFF8EA"/><stop offset="100%" stop-color="#D6C8A8"/>
  </linearGradient>
  <linearGradient id="orangeGrad" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#F0A54A"/><stop offset="100%" stop-color="#C76A2A"/>
  </linearGradient>
  <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="1.7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <style>
    .outline { stroke:#EFE6CF; stroke-width:4; stroke-linejoin:round; stroke-linecap:round; }
    .ink { stroke:#203746; stroke-width:2.2; stroke-linejoin:round; stroke-linecap:round; }
    .thin { stroke:#EFE6CF; stroke-width:1.2; stroke-linejoin:round; stroke-linecap:round; opacity:.95; }
    .panel { fill:url(#tealGrad); } .shell { fill:url(#creamGrad); } .amber { fill:url(#orangeGrad); }
  </style>
</defs>

<rect x="28" y="8" width="8" height="48" rx="2" class="outline" fill="none" filter="url(#softGlow)"/>
<rect x="28" y="8" width="8" height="48" rx="2" class="ink panel"/>
<rect x="24" y="8" width="16" height="5" rx="2" class="outline" fill="none"/>
<rect x="24" y="8" width="16" height="5" rx="2" class="ink shell"/>
<rect x="24" y="51" width="16" height="5" rx="2" class="outline" fill="none"/>
<rect x="24" y="51" width="16" height="5" rx="2" class="ink shell"/>

</svg>