<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="96" viewBox="0 0 1280 96">

  <defs>
    <linearGradient id="metalDark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#27313d"/>
      <stop offset="22%" stop-color="#111822"/>
      <stop offset="55%" stop-color="#0a0f16"/>
      <stop offset="100%" stop-color="#202b37"/>
    </linearGradient>

    <linearGradient id="metalEdge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#415062"/>
      <stop offset="40%" stop-color="#1a2430"/>
      <stop offset="100%" stop-color="#4b5b6f"/>
    </linearGradient>

    <linearGradient id="innerPanel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#18222d"/>
      <stop offset="50%" stop-color="#0a1017"/>
      <stop offset="100%" stop-color="#141d28"/>
    </linearGradient>

    <linearGradient id="blueLineH" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2aa8ff" stop-opacity="0"/>
      <stop offset="10%" stop-color="#41b6ff" stop-opacity="0.92"/>
      <stop offset="50%" stop-color="#4fc0ff" stop-opacity="1"/>
      <stop offset="90%" stop-color="#41b6ff" stop-opacity="0.92"/>
      <stop offset="100%" stop-color="#2aa8ff" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="blueLineV" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#2aa8ff" stop-opacity="0"/>
      <stop offset="10%" stop-color="#41b6ff" stop-opacity="0.92"/>
      <stop offset="50%" stop-color="#4fc0ff" stop-opacity="1"/>
      <stop offset="90%" stop-color="#41b6ff" stop-opacity="0.92"/>
      <stop offset="100%" stop-color="#2aa8ff" stop-opacity="0"/>
    </linearGradient>

    <filter id="glowSoft" x="-60%" y="-200%" width="220%" height="500%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="glowSoftV" x="-200%" y="-60%" width="500%" height="220%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="panelShadow" x="-20%" y="-20%" width="160%" height="160%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000000" flood-opacity="0.65"/>
    </filter>

    <filter id="noise">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" seed="12" result="t"/>
      <feColorMatrix in="t" type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="table" tableValues="0 0.045"/>
      </feComponentTransfer>
    </filter>
  </defs>

  <g filter="url(#panelShadow)">
    <rect x="8" y="10" width="1264" height="72" rx="4" fill="url(#metalDark)" stroke="url(#metalEdge)" stroke-width="2"/>
    <rect x="20" y="18" width="1240" height="8" rx="2" fill="#d7e0ea" opacity="0.14"/>
    <rect x="20" y="28" width="1240" height="2" fill="#070b10" opacity="0.85"/>
    <path d="M17 17 h80 l-9 12 h-71z" fill="#0a0f15" stroke="#445468" stroke-width="1.5"/>
    <path d="M1184 17 h79 v28 h-16 l-9 -10 h-54z" fill="#0a0f15" stroke="#445468" stroke-width="1.5"/>
    <rect x="170" y="18" width="1.5" height="42" fill="#46586e" opacity="0.8"/>
    <rect x="1128" y="18" width="1.5" height="42" fill="#46586e" opacity="0.8"/>
    <rect x="32" y="54" width="1186" height="4" rx="2" fill="url(#blueLineH)" filter="url(#glowSoft)"/>
    <rect x="16" y="10" width="1248" height="72" rx="4" fill="white" opacity="0.28" filter="url(#noise)"/>
    <rect x="16" y="73" width="1248" height="2" fill="#67a7ff" opacity="0.18"/>
  </g>
</svg>