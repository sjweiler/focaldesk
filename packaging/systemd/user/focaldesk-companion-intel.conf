# Optional drop-in for an Intel-connected companion on x86_64 systems.
# Install as ~/.config/systemd/user/focaldesk-companion-dashboard.service.d/70-intel-renderer.conf
# Verify the Intel ICD path on the target system before enabling.
[Service]
Environment=GSK_RENDERER=vulkan
Environment=VK_DRIVER_FILES=/usr/share/vulkan/icd.d/intel_icd.x86_64.json
