# Native focald-secrets ACL. Missing grants are denied.
#
# Read access for Focaldesk's AI service. An explicit empty allow_write keeps
# the daemon from creating or replacing credentials.
[grants."unit:focaldesk-server.service"]
allow = ["ai/*"]
allow_write = []

# Automation state may be split into narrower namespaces as credential-backed
# integrations are added.
[grants."unit:focaldesk-automation.service"]
allow = ["automation/*"]
allow_write = ["automation/state/*"]
